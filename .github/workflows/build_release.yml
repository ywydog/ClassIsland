name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签'
        required: true
        type: string
      primary_version:
        description: '主发布版本'
        required: true
        type: string
      is_test_mode:
        description: '是否处于测试发布模式'
        required: false
        type: boolean

env:
  PDC_CLIENT_VERSION: 1.0.1.0
  DOTNET_SDK_VERSION: 10.0.302
  MACOS_XCODE_PATH: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build_app:
    runs-on: ${{ matrix.os == 'linux' &&  'ubuntu-24.04' || ( matrix.os == 'macos' && 'macos-26' || 'windows-2022' ) }}
    env:
      build_id: appBase_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      artifact_name: out_${{ matrix.package == 'folder' &&  'appBase' || 'app' }}_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      isTestMode: ${{ github.event.inputs.is_test_mode }}
      arch: ${{ matrix.arch }}
    strategy:
      matrix:
        build_type: ['full', 'selfContained']
        package: ['folder', 'deb']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows', 'linux']
        exclude: 
          - os: linux
            arch: x86
          - os: windows
            package: deb
          - os: linux
            build_type: full  # Linux 上安装 .NET 运行时很不方便，故使用自包含打包。
        include:
          - os: macos
            package: pkg
            build_type: selfContained
            arch: arm64
          - os: macos
            package: pkg
            build_type: selfContained
            arch: x64
    name: Build_AppBase_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.release_tag }}
      
      - name: List files
        run: ls
      
      - name: Install .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Pin .NET SDK
        shell: bash
        run: |
          # setup-dotnet installs the SDK but does not override global.json selection.
          dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward disable --force
          dotnet --info
          test "$(dotnet --version)" = "$DOTNET_SDK_VERSION"
      
      - name: Install Macos workload
        if: ${{ matrix.os == 'macos' }}
        run: |
          sudo xcode-select -s "$MACOS_XCODE_PATH"
          xcodebuild -version
          xcodebuild -showsdks
          dotnet workload install macos --version "$DOTNET_SDK_VERSION"
          test "$(dotnet workload --version)" = "$DOTNET_SDK_VERSION"
        
      - name: Add GitHub Package Registry
        run: dotnet nuget add source --username ClassIsland --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/ClassIsland/index.json"
        
      - uses: little-core-labs/get-git-tag@v3.0.1
        id: tagName
      
      - name: ☢️ Nuke
        env:
          buildType: ${{ matrix.build_type }}
          package: ${{ matrix.package }}
          is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          appVersion: ${{ steps.tagName.outputs.tag }} 
          buildName: ${{ matrix.package == 'folder' &&  'appBase' || 'app' }}  # 打包版本的构建将在这一步直接产生完整的包体，无需经过分装
        run: ${{ matrix.os == 'windows' && 'pwsh -ep bypass ./build.ps1 PublishApp' || './build.sh PublishApp' }}
      
      - name: Upload Unsigned APP to artifacts
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ./out/*.zip
            ./out/*.appx
            ./out/*.deb
            ./out/*.pkg

  build_android:
    runs-on: ubuntu-24.04
    env:
      artifact_name: out_app_android_${{ matrix.arch }}_monoaot_apk
      arch: ${{ matrix.arch }}
    strategy:
      matrix:
        arch: ['arm64', 'x64']
    name: Build_Android_${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.release_tag }}

      - name: Install .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Pin .NET SDK
        shell: bash
        run: |
          # setup-dotnet installs the SDK but does not override global.json selection.
          dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward disable --force
          dotnet --info
          test "$(dotnet --version)" = "$DOTNET_SDK_VERSION"

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Add GitHub Package Registry
        run: dotnet nuget add source --username ClassIsland --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/ClassIsland/index.json"

      - uses: little-core-labs/get-git-tag@v3.0.1
        id: tagName

      - name: Build Android APK
        env:
          appVersion: ${{ steps.tagName.outputs.tag }}
          arch: ${{ matrix.arch }}
          osName: android
          package: apk
          buildType: monoaot
          buildName: app
          isProductionBuild: ${{ github.event.inputs.release_tag && github.event_name != 'pull_request' && github.event.inputs.is_test_mode != 'true' }}
        run: ./build.sh PublishAndroidApp

      - name: Upload Android APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ./out/*.apk
          if-no-files-found: error
            
  build_launcher:
    runs-on: ${{ matrix.os == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}
    env:
      build_id: launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      artifact_name: out_launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      isTestMode: ${{ github.event.inputs.is_test_mode }}
      arch: ${{ matrix.arch }}
    strategy:
      matrix:
        build_type: ['aot']
        package: ['singleFile']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows', 'linux']
        exclude:
          - os: linux
            arch: x86
    name: Build_Launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    container: ${{ matrix.os == 'linux' && 'ghcr.io/classisland/philia-build-image:main' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.release_tag }}

      - name: List files
        run: ls
      
      - name: Install .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Pin .NET SDK
        shell: bash
        run: |
          # setup-dotnet installs the SDK but does not override global.json selection.
          dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward disable --force
          dotnet --info
          test "$(dotnet --version)" = "$DOTNET_SDK_VERSION"

      - name: Setup philia Environment
        if: ${{ matrix.os == 'linux' }}
        run: |
          select-objcopy ${{ matrix.arch }}
          git config --global --add safe.directory '*'

      - name: ☢️ Nuke
        env:
          buildType: ${{ matrix.build_type }}
          package: ${{ matrix.package }}
          is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          buildName: launcher
        run: ${{ matrix.os == 'windows' && 'pwsh -ep bypass ./build.ps1 PublishLauncher' || './build.sh PublishLauncher' }} 
          
      - name: Upload Unsigned APP to artifacts
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ./out/*.zip
            
  pack_app:
    runs-on: ${{ matrix.os == 'windows' && 'windows-2022' || 'ubuntu-latest' }}
    needs: [ build_app, build_launcher ]
    env:
      build_id: app_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      artifact_name: out_app_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      isTestMode: ${{ github.event.inputs.is_test_mode }}
      arch: ${{ matrix.arch }}
    strategy:
      matrix:
        build_type: ['full', 'selfContained']
        package: ['folder', 'installer']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows', 'linux']
        exclude:
          - os: linux
            arch: x86
          - os: linux
            package: installer
          - build_type: full
            package: installer
          - os: linux
            build_type: full  # Linux 上安装 .NET 运行时很不方便，故使用自包含打包。
    name: Pack_App_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.release_tag }}
          
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts

      - name: Combine Artifacts
        run: pwsh -ep bypass ./tools/release-gen/combine-artifacts.ps1

      - name: Generate Package
        env:
          package: ${{ matrix.package }}
          isRelease: ${{ startsWith(github.ref, 'refs/tags/') }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          buildType: ${{ matrix.build_type }}
        run: pwsh -ep bypass ./tools/release-gen/pack/entry.ps1

      - name: Compile .iss to .exe Installer
        if: ${{ matrix.os == 'windows' && matrix.package == 'installer' }}
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./installer/setup.iss
          options: |
            /DAppVersion=${{ github.event.inputs.release_tag || '2.0.0.0' }}
            /FClassIsland_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_installer.exe
            /O${{ github.workspace }}\out_pack
            /DSourceDir=${{ github.workspace }}\out_pack\pack
            /DArch=${{ matrix.arch }}
      

      - name: Upload Packages and Installer to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ${{ github.workspace }}/out_pack/*.zip
            ${{ github.workspace }}/out_pack/*.exe
          
  publish:
    runs-on: ubuntu-latest
    if: ${{ always() && success() && github.event.inputs.release_tag && github.event_name != 'pull_request' }}
    needs: [ pack_app, build_android ]
    permissions:
      contents: write
    concurrency:
      group: "publish-public"
    environment:
      name: ${{ github.event.inputs.is_test_mode == 'true' && 'staging' || 'public' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.release_tag }} 
          
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts

      - name: Init Artifacts
        shell: pwsh
        run: ./tools/release-gen/init-artifacts.ps1

      - name: Upload APP to release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./out/*.zip,./out/*.appx,./out/*.deb,./out/*.pkg,./out/*.apk"
          draft: true
          bodyFile: ./doc/ChangeLogs/${{ github.event.inputs.primary_version }}/${{ github.event.inputs.release_tag }}/App.md
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.release_tag }} 
